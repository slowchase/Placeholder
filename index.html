<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="placeholder is a weekly san francisco events calendar.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#ffffff" />
  <title>placeholder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <button id="brandButton" class="brand" type="button" aria-label="Return to orbit">placeholder</button>

    <section class="viewport" aria-label="Placeholder newsletter interactive orbit">
      <div id="solarSystem" class="solar-system">
        <svg id="orbitSvg" class="orbit-svg" viewBox="0 0 800 800" role="img" aria-labelledby="orbitTitle orbitDesc">
         <g id="cameraLayer">
            <g id="ringsLayer"></g>
            <g id="hoverInfoRing" class="hover-info-ring" aria-hidden="true">
              <g class="hover-info-ring__motion">
                <g class="hover-info-ring__line-motion">
                  <circle class="hover-info-ring__line" cx="407" cy="394" r="92"></circle>
                  <defs>
                    <path id="hoverInfoRingPath" d="M 291 400 A 109 109 0 1 1 509 400 A 109 109 0 1 1 291 400"></path>
                  </defs>
                  <text class="hover-info-ring__text">
                    <textPath id="hoverInfoRingText" href="#hoverInfoRingPath" startOffset="25%" text-anchor="middle">about</textPath>
                  </text>
                </g>
              </g>
            </g>
          </g>
        </svg>

        <input
          id="emailInput"
          class="email-capture"
          type="email"
          inputmode="email"
          autocomplete="email"
          autocapitalize="none"
          spellcheck="false"
          aria-label="Email address"
        />

        <div id="centerPlane" class="center-plane">
          <button id="subscribeButton" class="subscribe-button" type="button" aria-label="Subscribe">
            <svg class="subscribe-button__svg" viewBox="0 0 100 100" aria-hidden="true">
              <defs>
                <path id="subscribeLabelPath" d="M 12.7 71 A 42 42 0 0 0 87.3 71" />
              </defs>
              <text class="subscribe-button__text">
                <textPath id="subscribeButtonLabel" href="#subscribeLabelPath" startOffset="50%" text-anchor="middle">subscribe</textPath>
              </text>
            </svg>
          </button>

          <div class="center-orbit-control center-orbit-control--about" data-control="about">
            <button id="aboutButton" class="satellite-button satellite-button--about" type="button" aria-label="About">
              <svg class="satellite-button__svg" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="aboutLabelPath" d="M 12.7 71 A 42 42 0 0 0 87.3 71" /></defs><text class="satellite-button__text"><textPath href="#aboutLabelPath" startOffset="50%" text-anchor="middle">about</textPath></text></svg>
            </button>
          </div>

          <div class="center-orbit-control center-orbit-control--contact" data-control="contact">
            <button id="contactButton" class="satellite-button satellite-button--contact" type="button" aria-label="Contact">
              <svg class="satellite-button__svg" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="contactLabelPath" d="M 12.7 71 A 42 42 0 0 0 87.3 71" /></defs><text class="satellite-button__text"><textPath href="#contactLabelPath" startOffset="50%" text-anchor="middle">contact</textPath></text></svg>
            </button>
          </div>

          <div class="center-orbit-control center-orbit-control--highlight" data-control="highlight">
            <button id="highlightButton" class="satellite-button satellite-button--highlight" type="button" aria-label="Open highlight" aria-expanded="false">
              <svg class="satellite-button__svg" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="highlightLabelPath" d="M 12.7 71 A 42 42 0 0 0 87.3 71" /></defs><text class="satellite-button__text"><textPath href="#highlightLabelPath" startOffset="50%" text-anchor="middle">highlight</textPath></text></svg>
            </button>
          </div>

          <div class="center-orbit-control center-orbit-control--orbit" data-control="orbit">
            <button id="orbitToggleButton" class="satellite-button satellite-button--orbit" type="button" aria-label="Pause ring orbit" aria-pressed="false">
              <svg class="satellite-button__svg" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="orbitLabelPath" d="M 12.7 71 A 42 42 0 0 0 87.3 71" /></defs><text class="satellite-button__text"><textPath href="#orbitLabelPath" startOffset="50%" text-anchor="middle">orbit</textPath></text></svg>
            </button>
          </div>

          <div class="center-orbit-control center-orbit-control--spiral" data-control="spiral">
            <button id="spiralButton" class="satellite-button satellite-button--spiral" type="button" aria-label="Spiral reset">
              <svg class="satellite-button__svg" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="spiralControlLabelPath" d="M 12.7 71 A 42 42 0 0 0 87.3 71" /></defs><text class="satellite-button__text"><textPath href="#spiralControlLabelPath" startOffset="50%" text-anchor="middle">spiral</textPath></text></svg>
            </button>
          </div>

          <div class="center-orbit-control center-orbit-control--submit" data-control="submit">
            <button id="submitEventButton" class="satellite-button satellite-button--submit" type="button" aria-label="Submit an event">
              <svg class="satellite-button__svg" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="submitLabelPath" d="M 12.7 71 A 42 42 0 0 0 87.3 71" /></defs><text class="satellite-button__text"><textPath href="#submitLabelPath" startOffset="50%" text-anchor="middle">submit event</textPath></text></svg>
            </button>
          </div>

          <aside id="highlightPanel" class="highlight-panel" aria-hidden="true" aria-label="Highlight">
            <div class="highlight-panel__photo">
              <img id="highlightPhoto" alt="" />
            </div>
            <div class="highlight-panel__copy">
              <p id="highlightName" class="highlight-panel__name">name</p>
              <p id="highlightDescription" class="highlight-panel__description">brief description</p>
            </div>
          </aside>
        </div>


        <div class="mobile-bottom-actions" aria-label="Mobile navigation">
          <button id="mobileHighlightLink" class="mobile-bottom-link mobile-highlight-link" type="button" aria-controls="highlightPanel" aria-expanded="false">highlight</button>
          <button id="feelingLostLink" class="feeling-lost-link is-visible" type="button" aria-controls="feelingLostPanel" aria-expanded="false">feeling lost?</button>
          <p class="mobile-submit-hint">swipe up to submit event</p>
        </div>

        <div id="feelingLostBackdrop" class="feeling-lost-backdrop" aria-hidden="true"></div>

        <form id="eventSubmission" class="event-submission" autocomplete="off" aria-label="Submit an event"></form>
      </div>

      <p id="statusMessage" class="status-message" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/orbit-core.js"></script>
  <script src="js/content-loader.js?v=pass12"></script>
  <script src="js/ring-drag.js?v=subscribe-loading-2"></script>
  <script src="js/ring-drag.js"></script>
  <script src="js/spiral-reset.js"></script>
  <script src="js/center-menu.js"></script>
  <script src="js/event-form.js"></script>
  <script src="js/camera.js"></script>
</body>
</html>
